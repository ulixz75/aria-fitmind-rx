<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepDB — bundle viewer</title>
<style>
:root{--bg:#0f1115;--panel:#16181d;--panel2:#1b1e25;--bd:#272a31;--bd2:#343843;
--fg:#e7e9ee;--mut:#9aa0aa;--mut2:#6b7280;--accent:#10b981;--accent-fg:#04231a;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}
#app{display:grid;grid-template-columns:330px 1fr;height:100vh;height:100dvh}
/* grid items default to min-width:auto — content min-content would blow the
   1fr tracks past the viewport on narrow screens, so pin both panes to 0 */
#rail{border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel)}
#rail header{padding:12px;border-bottom:1px solid var(--bd);display:flex;flex-direction:column;gap:8px}
#rail h1{margin:0;font-size:14px;font-weight:600}
#rail h1 small{color:var(--mut);font-weight:400}
input,select{background:var(--panel2);color:var(--fg);border:1px solid var(--bd2);border-radius:8px;padding:7px 9px;font:inherit;width:100%}
.filters{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
#list{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
#list li{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;cursor:pointer}
#list li:hover{background:var(--panel2)}
#list li.sel{background:var(--accent);color:var(--accent-fg)}
#list li.sel .sub{color:var(--accent-fg);opacity:.8}
#list .thumb{width:34px;height:34px;border-radius:6px;flex:none;object-fit:contain;background:#fff}
#list .nm{font-weight:500;font-size:13px}
#list .sub{font-size:11px;color:var(--mut)}
#count{font-size:12px;color:var(--mut)}
#pane{display:flex;flex-direction:column;min-height:0;min-width:0}
#mob-bar{display:none;flex:none;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--bd);background:var(--panel)}
#mob-bar button{background:var(--panel2);color:var(--fg);border:1px solid var(--bd2);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
#mob-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600}
#mob-bar .mob-cta{background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap}
#detail{overflow:auto;padding:20px;min-height:0;flex:1}
.empty{color:var(--mut);display:grid;place-items:center;height:100%}
.stages{display:flex;flex-wrap:wrap;gap:14px}
.stages figure{margin:0;flex:1 1 230px;min-width:200px;max-width:380px}
.stages figcaption{margin-top:6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut2);text-align:center}
.anim-note{margin-top:10px;padding:8px 11px;border-radius:8px;background:var(--panel2);border:1px solid var(--bd2);color:var(--mut);font-size:11.5px;line-height:1.5}
.anim-note b{color:var(--fg)}
/* phone-only chrome — defaults live here (before the media block) so the
   ≤900px rules, at equal specificity, win on source order. .ctl.mview-ctl
   (not bare .mview-ctl) so it outranks the generic .ctl{display:flex} */
.ctl.mview-ctl{display:none}
.nav-ex{display:none}
/* ≤900px: master→detail — exactly one pane on screen, .m-detail flips which */
@media(max-width:900px){
#app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr)}
#app:not(.m-detail) #pane{display:none}
#app.m-detail #rail{display:none}
#rail{border-right:0}
#list li{padding:10px 8px}
#list .thumb{width:40px;height:40px}
#mob-bar{display:flex}
#detail{padding:12px;overflow-x:hidden}
.ctl{flex-wrap:wrap}
.card .slug{overflow-wrap:anywhere}
.stages{gap:10px}
.stages figure{flex:1 1 40%;min-width:140px;max-width:none}
.stages figure[data-anim]{flex-basis:100%}
/* phone + classic + animation: default to the loop alone (start/peak would be
   three near-identical squares stacked); the loop/frames toggle reveals the
   stills so buyers can see they exist */
.stages{position:relative}
.stages.has-anim:not(.show-stills) figure:not([data-anim]){display:none}
.stages.has-anim.show-stills figure[data-anim]{display:none}
.ctl.mview-ctl{display:flex}
/* prev/next arrows over the image — switch exercises without going back */
.nav-ex{display:grid;place-items:center;position:absolute;top:50%;transform:translateY(-50%);
  width:40px;height:40px;border-radius:999px;border:1px solid var(--bd2);
  background:rgba(11,13,16,.6);color:var(--fg);font-size:22px;line-height:1;
  cursor:pointer;z-index:5;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.nav-ex[data-nav="-1"]{left:6px}
.nav-ex[data-nav="1"]{right:6px}
.nav-ex:disabled{opacity:.3;pointer-events:none}
.rel .ty{min-width:90px}
}
.stage{aspect-ratio:1/1;border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:grid;place-items:center;position:relative}
.stage img{width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .15s}
.stage img.ready{opacity:1}
.stage .spin{position:absolute;width:36px;height:36px;border:3px solid rgba(128,134,148,.35);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
.stage img.ready+.spin{display:none}
@keyframes sp{to{transform:rotate(360deg)}}
.bg-checker{background:#fff;background-image:linear-gradient(45deg,#c9ced6 25%,transparent 25%),linear-gradient(-45deg,#c9ced6 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#c9ced6 75%),linear-gradient(-45deg,transparent 75%,#c9ced6 75%);background-size:26px 26px;background-position:0 0,0 13px,13px -13px,-13px 0}
.bg-white{background:#fff}.bg-dark{background:#0b0d10}
.bg-brand{background:linear-gradient(135deg,#d946ef,#7c3aed,#4f46e5)}
.controls{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:10px}
.ctl{display:flex;align-items:center;gap:8px}
.ctl .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut2)}
.grp{display:inline-flex;border:1px solid var(--bd2);border-radius:8px;overflow:hidden}
.grp button,.locsw button{background:var(--panel2);color:var(--fg);border:0;padding:6px 11px;font:inherit;cursor:pointer}
.grp button+button{border-left:1px solid var(--bd2)}
.grp button.on,.locsw button.on{background:var(--accent);color:var(--accent-fg);font-weight:600}
.grp button:disabled{opacity:.35;cursor:not-allowed}
.card h2{margin:0 0 2px;font-size:22px}
.card .slug{color:var(--mut);font-size:12px;font-family:ui-monospace,monospace}
.locsw{display:inline-flex;border:1px solid var(--bd2);border-radius:8px;overflow:hidden;margin:10px 0}
.locsw button+button{border-left:1px solid var(--bd2)}
.sec{margin-top:16px}
.sec h3{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut2)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px}
.meta dt{color:var(--mut)}.meta dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--bd2);border-radius:999px;padding:3px 10px;font-size:12px}
.chip.sec2{color:var(--mut)}
ol,ul{margin:0;padding-left:18px}ol li,ul li{margin:2px 0}
.rel{display:flex;gap:8px;align-items:center;padding:3px 0}
.rel .ty{font-size:11px;color:var(--mut);min-width:120px}
.rel a{color:var(--accent);cursor:pointer;text-decoration:none}.rel a:hover{text-decoration:underline}
.rel .out{color:var(--mut);cursor:help}
details{margin-top:16px;border:1px solid var(--bd);border-radius:10px;background:var(--panel)}
summary{cursor:pointer;padding:9px 12px;font-size:12px;color:var(--mut)}
pre{margin:0;padding:12px;overflow:auto;font:12px/1.5 ui-monospace,monospace;color:#9be29b;border-top:1px solid var(--bd)}
.flag{color:var(--accent)}
#premium-teaser{border-top:1px solid var(--bd);padding:12px;flex:none}
#premium-teaser .pt-badge{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut2);margin-bottom:8px}
#premium-teaser .pt-media{aspect-ratio:1/1;border-radius:10px;overflow:hidden;position:relative;cursor:pointer;background:#0b0d10}
#premium-teaser .pt-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .25s}
#premium-teaser .pt-anim{opacity:0}
#premium-teaser .pt-media:hover .pt-anim,#premium-teaser .pt-media.playing .pt-anim{opacity:1}
#premium-teaser .pt-media:hover .pt-still,#premium-teaser .pt-media.playing .pt-still{opacity:0}
#premium-teaser p{font-size:12px;color:var(--mut);margin:8px 0}
#premium-teaser a.pt-cta{display:block;text-align:center;background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:7px;font-size:12px;font-weight:600;text-decoration:none;margin-top:6px}
.site-links{display:flex;gap:8px}
.site-links a{flex:1;text-align:center;border:1px solid var(--bd2);border-radius:8px;padding:7px 9px;font-size:12px;color:var(--fg);text-decoration:none;white-space:nowrap}
.site-links a:hover{border-color:var(--accent)}
.site-links a.buy{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
a.dl{font-size:11px;color:var(--mut);text-align:center;text-decoration:underline;text-underline-offset:2px}
a.dl:hover{color:var(--fg)}
</style>
</head>

</div>

ialis", "brachioradialis"], "name_de": "SZ-Stangen Spider Curl", "instructions_de": ["Lege dich mit der Brust nach unten auf eine Schrägbank und halte eine SZ-Stange mit Untergriff.", "Lass deine Arme gerade von den Schultern nach unten hängen.", "Curie die Stange zu deinen Schultern hoch.", "Spanne die Bizeps oben in der Bewegung an.", "Senke die Stange kontrolliert ab.", "Für die gewünschte Wiederholungszahl wiederholen."], "description_de": "Ein brustgestützter Curl über der Schrägbank mit der SZ-Stange — isoliert den Bizeps mit strikter Technik.", "tips_de": ["Lass die Arme senkrecht hängen und halte die Oberarme fixiert.", "Curle nur mit dem Bizeps — die Bank nimmt dir jede Ausrede zum Schwungholen.", "Senke die Stange bis zur vollen Dehnung, bevor du die nächste Wiederholung beginnst."], "name_es": "Spider Curl con Barra Z", "instructions_es": ["Túmbate boca abajo en un banco inclinado sujetando una barra Z con agarre supino.", "Deja que tus brazos cuelguen rectos desde los hombros.", "Sube la barra hacia tus hombros.", "Aprieta los bíceps en la parte alta del movimiento.", "Baja la barra de forma controlada.", "Repite el número de repeticiones deseado."], "description_es": "Un curl con el pecho apoyado sobre un banco inclinado usando barra Z, aislando el bíceps con técnica estricta.", "tips_es": ["Deja los brazos colgando verticales y mantén fijos los brazos superiores.", "Haz el curl solo con el bíceps: el banco elimina cualquier excusa para balancearte.", "Baja hasta el estiramiento completo antes de empezar la siguiente repetición."], "images": {"classic": ["start", "peak"], "flat": ["start", "peak"]}, "met": 5.0, "animation": true, "animation_type": "motion"}, {"id": "front-squat", "name_en": "Front Squat", "description_en": "A barbell squat with the bar held in front on the deltoids, emphasizing quads and core.", "category": "strength", "force_type": "push", "mechanic": "compound", "difficulty": "intermediate", "equipment": "barbell", "body_part": "upper ombina trabajo de core con cardio.", "instructions_es": ["Comienza en posición de plancha alta.", "Lleva una rodilla hacia el pecho.", "Cambia rápidamente de pierna llevando la otra rodilla hacia adelante.", "Continúa alternando a un ritmo brioso.", "Repite."], "tips_es": ["Mantén los hombros encima de las muñecas todo el tiempo.", "No dejes que la cadera se eleve hacia el techo.", "Acelera solo mientras puedas mantener la técnica."], "images": {"classic": ["start", "peak"], "flat": ["start", "peak"]}, "met": 8.0, "animation": true, "animation_type": "motion"}, {"id": "one-arm-kettlebell-row", "name_en": "One Arm Kettlebell Row", "description_en": "A unilateral rowing exercise with bench support, building the lats and mid-back one side at a time.", "category": "strength", "force_type": "pull", "mechanic": "compound", "difficulty": "intermediate", "equipment": "kettlebell", "body_part": "back", "is_unilateral": true, "is_bodyweight": false, "variation_group": "row", "goals": ["hypertrophy", "strength"], "tags": ["knee_safe", "lower_back_safe", "shoulder_safe", "no_axial_load"], "instructions_en": ["Place one hand and knee on a bench for support.", "Hold a kettlebell in the opposite hand with your arm extended.", "Pull the kettlebell toward your hip by driving your elbow back.", "Squeeze your back at the top of the movement.", "Lower the kettlebell with control.", "Complete reps on one side, then switch."], "tips_en": ["Keep your torso square to the floor throughout the set.", "Pull with your back muscles rather than just your arm.", "Keep your neck neutral, eyes on the floor just ahead."], "primary_muscles": ["latissimus_dorsi", "rhomboids"], "secondary_muscles": ["biceps_brachii", "posterior_deltoid", "trapezius"], "relations": [{"to": "single-arm-db-row", "type": "alternative"}], "name_de": "Einarmiges Kettlebell-Rudern", "instructions_de": ["Stütze eine Hand und ein Knie auf einer Bank ab.", "Halte eine Kettlebell mit der anderen Hand bei gestrecktem Arm.", "Ziehe fe", "no_axial_load", "lower_back_safe", "shoulder_safe"], "synonyms": ["plate loaded lateral raise", "iso-lateral lateral raise", "plate loaded side raise", "machine side raise", "hammer strength lateral raise", "plate loaded delt raise"], "instructions_en": ["Set the seat height so that the pivot of the arm pads lines up with the point of your shoulders when you sit down.", "Load the plate horns evenly on both sides and sit with your back flat against the pad.", "Place the outside of your upper arms against the pads with your elbows bent and your arms hanging down.", "Push out and up against the pads until your upper arms are roughly level with your shoulders.", "Lower under control until your arms are back at your sides, and repeat for the desired number of repetitions."], "tips_en": ["Set the seat first. If the pivot sits below your shoulder the pads drive your arm across your body instead of out to the side, and the side deltoid stops being the muscle doing the work.", "Push with the arm, not the hand. The handles are there to stop your arms sliding off the pads -- gripping hard pulls the biceps and forearms into a raise that should be all deltoid.", "Stop at shoulder height. Going higher hands the last part of the rep to the traps, and the machine will happily let you."], "primary_muscles": ["lateral_deltoid"], "secondary_muscles": ["anterior_deltoid", "trapezius"], "relations": [{"to": "lateral-raise", "type": "alternative"}, {"to": "single-arm-plate-loaded-lateral-raise", "type": "alternative"}], "name_de": "Seitheben an der Scheibenmaschine", "description_de": "Ein sitzendes Seitheben an einer scheibenbeladenen Maschine, bei dem Polster gegen die Oberarme drücken, sodass die seitlichen Schultern die Last heben, ohne sie mit den Händen zu greifen.", "instructions_de": ["Stelle die Sitzhöhe so ein, dass der Drehpunkt der Armpolster im Sitzen auf Höhe deiner Schulterspitzen liegt.", "Belade die Scheibenaufnahmen auf beiden Seiten gleichmäßig und setze dich mit imus_dorsi"], "secondary_muscles": ["posterior_deltoid", "rhomboids"], "name_de": "Latzug im Untergriff", "instructions_de": ["Befestige eine gerade Stange am Latzuggerät.", "Greife die Stange im Untergriff, schulterbreit.", "Setze dich und sichere deine Oberschenkel unter dem Polster.", "Ziehe die Stange bis zur oberen Brust herunter.", "Spanne Latissimus und Bizeps am unteren Punkt an.", "Führe die Stange kontrolliert zur Ausgangsposition zurück.", "Wiederhole für die gewünschte Anzahl an Wiederholungen."], "description_de": "Eine Latzug-Variante im Untergriff, die den Bizeps stärker mit einbezieht.", "tips_de": ["Halte die Brust aufrecht und lehne dich nicht übermäßig zurück.", "Ziehe mit den Ellbogen, nicht nur mit den Händen.", "Spanne den Latissimus am unteren Punkt der Bewegung an."], "name_es": "Jalón al Pecho Agarre Supino", "instructions_es": ["Coloca una barra recta en una máquina de jalón al pecho.", "Sujeta la barra con agarre supino, al ancho de los hombros.", "Siéntate y asegura tus muslos bajo la almohadilla.", "Tira de la barra hacia la parte superior del pecho.", "Contrae el dorsal y el bíceps en la parte baja.", "Vuelve la barra a la posición inicial con control.", "Repite el número de repeticiones deseado."], "description_es": "Una variante del jalón al pecho con agarre supino que aumenta la participación del bíceps.", "tips_es": ["Mantén el pecho erguido y evita inclinarte demasiado hacia atrás.", "Tira con los codos, no solo con las manos.", "Contrae el dorsal en la parte baja del movimiento."], "images": {"classic": ["start", "peak"], "flat": ["start", "peak"]}, "met": 6.0, "animation": true, "animation_type": "motion"}, {"id": "side-lying-lateral-raise", "name_en": "Side-Lying Lateral Raise", "description_en": "A dumbbell lateral deltoid isolation exercise performed lying on one side on a flat bench, providing constant tension and eliminating momentum from the standing position.", "category": "strength", "force_type": "push", "mechanic": "isolation", "difficulty": "beginner", "equipment": "dumbbell", "equipment_alternatives": ["cable"], "body_part": "shoulders", "is_unilateral": true, "is_bodyweight": false, "goals": ["hypertrophy"], "tags": ["shoulder_focus", "push_day", "requires_bench"], "synonyms": ["side-lying lateral raise"], "instructions_en": ["Lie on your side on a flat bench with your bottom arm supporting your head or gripping the bench edge.", "Hold a dumbbell in your top hand with your arm resting along your side.", "Keeping your elbow slightly bent, raise the dumbbell upward until your arm is perpendicular to the floor.", "Pause briefly at the top, then lower the dumbbell slowly back to your side.", "Complete all reps on one side before switching."], "tips_en": ["Keep your torso still — only the working arm should move.", "The lying position removes momentum and isolates the lateral deltoid effectively.", "Use a lighter weight than your standing lateral raise — the leverage is more challenging."], "primary_muscles": ["lateral_deltoid"], "secondary_muscles": ["supraspinatus", "trapezius"], "relations": [{"to": "lateral-raise", "type": "alternative"}], "name_de": "Seitheben Seitliegend", "description_de": "Eine Kurzhantel-Isolationsübung für den seitlichen Schultermuskel in der Seitenlage auf einer flachen Bank, die konstante Spannung ohne Schwungnutzung gewährleistet.", "instructions_de": ["Auf einer flachen Bank seitlich liegen, den unteren Arm zur Kopfstütze oder zum Griff an der Bank nutzen.", "Kurzhantel in der oberen Hand halten, Arm locker an der Seite.", "Mit leicht gebeugtem Ellbogen die Hantel anheben, bis der Arm senkrecht zum Boden steht.", "Kurz oben halten, dann die Hantel langsam zurück zur Seite absenken.", "Alle Wiederholungen ausführen, dann Seite wechseln."], "tips_de": ["Oberkörper ruhig halten — nur der arbeitende Arm soll sich bewegen.", "Die liegende Position verhindert Schwung und isoliert den seitlichen Deltamuskel effektiv.", "Leichteres Gewicht als beim stehenden Seitheben wählen — der Hebelarm ist anspruchsvoller."], "name_es": "Elevación Lateral Tumbado de Lado", "description_es": "Un ejercicio de aislamiento del deltoides lateral con mancuerna en posición lateral sobre un banco plano, que proporciona tensión constante sin impulso.", "instructions_es": ["Túmbate de lado sobre un banco plano usando el brazo inferior para apoyar la cabeza o sujetar el borde del banco.", "Sujeta una mancuerna con la mano superior con el brazo descansando a lo largo del costado.", "Con el codo ligeramente flexionado, eleva la mancuerna hasta que el brazo quede perpendicular al suelo.", "Pausa brevemente arriba, luego baja la mancuerna despacio hasta el costado.", "Completa todas las repeticiones en un lado antes de cambiar."], "tips_es": ["Mantén el torso quieto — solo el brazo de trabajo debe moverse.", "La posición tumbada elimina el impulso y aísla eficazmente el deltoides lateral.", "Usa un peso más ligero que en la elevación lateral de pie — la palanca es más exigente."], "images": {"classic": ["start", "peak"], "flat": ["start", "peak"]}, "met": 5.0, "animation": true, "animation_type": "motion"}, {"id": "smith-machine-front-squat", "name_en": "Smith Machine Front Squat", "description_en": "A squat on the Smith machine with the bar racked across the front of the shoulders, where the fixed path and the upright torso keep the work on the quads.", "category": "strength", "force_type": "push", "mechanic": "compound", "difficulty": "beginner", "equipment": "smith_machine", "equipment_alternatives": ["hack_squat"], "body_part": "upper_legs", "is_unilateral": false, "is_bodyweight": false, "variation_group": "squat", "goals": ["hypertrophy", "strength"], "tags": ["leg_day"], "synonyms": ["smith machine front squat", "smith front squat", "front squat on smith machine", "front rack smith squat", "machine front squat", "guided front squat"], "instructions_en": ["Set the bar at upper-chest height and step under it so it rests across the front of your shoulders, against your collarbones.", "Cross your arms over the bar or take an open front-rack grip, and drive your elbows up until your upper arms are close to parallel with the floor.", "Unrack the bar and stand with your feet about shoulder-width apart and slightly forward of it.", "Sit straight down, keeping your elbows high and your torso upright, until your thighs are at least parallel to the floor.", "Drive through the middle of your feet to stand back up, and repeat for the desired number of repetitions."], "tips_en": ["High elbows are the whole exercise. As soon as they drop, the bar rolls off your shoulders onto your hands and the rack position collapses.", "Set the safety stops just below your deepest squat position before you unrack anything -- on a front squat the fastest way out of a failed rep is to let the bar go.", "Standing slightly ahead of the bar lets you keep your torso vertical. Under a fixed path, a stance directly beneath the bar forces you to lean and pushes the bar off the front rack."], "primary_muscles": ["gluteus_maximus", "quadriceps"], "secondary_muscles": ["erector_spinae", "gluteus_medius", "hamstrings"], "relations": [{"to": "front-squat", "type": "alternative"}, {"to": "smith-machine-squat", "type": "regression_of"}], "name_de": "Smith Machine Front Squat", "description_de": "Eine Kniebeuge an der Smith Machine mit der Stange vorn auf den Schultern abgelegt, bei der die geführte Bahn und der aufrechte Oberkörper die Arbeit im Quadrizeps halten.", "instructions_de": ["Stelle die Stange auf Höhe der oberen Brust ein und tritt darunter, sodass sie vorn auf deinen Schultern am Schlüsselbein aufliegt.", "Kreuze die Arme über der Stange oder nimm einen offenen Front-Rack-Griff und schiebe die Ellenbogen hoch, bis die Oberarme fast parallel zum Boden stehen.", "Entracke die Stange und stelle die Füße etwa schulterbreit und leicht vor der Stange auf.", "Gehe gerade nach unten, halte die Ellenbogen oben und den Oberkörper aufrecht, bis id Muscles", "region": "back", "synonyms": ["rhomboid", "rhomboids", "rhomboid major", "rhomboid minor", "upper back"], "image": "rhomboids.webp"}, "serratus_anterior": {"name_en": "Serratus", "name_de": "Sägemuskel", "name_es": "Serrato Anterior", "name_scientific": "Serratus Anterior", "region": "chest", "synonyms": ["serratus", "serratus anterior", "boxer's muscle", "rib muscles"], "image": "serratus-anterior.webp"}, "supraspinatus": {"name_en": "Supraspinatus", "name_de": "Supraspinatus", "name_es": "Supraespinoso", "name_scientific": "Supraspinatus", "region": "shoulders", "synonyms": ["supraspinatus", "rotator cuff", "shoulder stabilizer"], "image": "lateral-deltoid.webp"}, "trapezius": {"name_en": "Traps", "name_de": "Trapezmuskel", "name_es": "Trapecio", "name_scientific": "Trapezius", "region": "back", "synonyms": ["trap", "traps", "trapezius", "upper traps", "lower traps", "mid traps"], "image": "trapezius.webp"}, "triceps_brachii": {"name_en": "Triceps", "name_de": "Trizeps", "name_es": "Tríceps", "name_scientific": "Triceps Brachii", "region": "upper_arms", "synonyms": ["tricep", "triceps", "triceps brachii", "horseshoe", "tris"], "image": "triceps-brachii.webp"}}, "equipment": {"barbell": {"name_en": "Barbell", "tags": ["free_weight"], "synonyms": ["bar", "olympic barbell", "straight bar", "olympic bar", "power bar"], "image": "barbell.webp", "name_de": "Langhantel", "name_es": "Barra"}, "battle_rope": {"name_en": "Battle Rope", "tags": ["conditioning_tool", "full_body", "cardio"], "synonyms": ["battle ropes", "heavy rope", "training rope", "conditioning rope"], "image": "battle-rope.webp", "name_de": "Battle Rope", "name_es": "Cuerda de batalla"}, "cable": {"name_en": "Cable Machine", "tags": ["cable"], "synonyms": ["cable pulley", "functional trainer", "cable crossover", "cable column", "cable station", "pulley machine", "cable tower"], "image": "cable.webp", "name_de": "Kabelzug", "name_es": "Polea"}, "dumbbell": {"name_en": "Dumbbell", "tags": ["free_weight"], "synonyms": ["db", "dumbell", "hex dumbbell", "rubber dumbbell", "hand weight"], "image": "dumbbell.webp", "name_de": "Kurzhantel", "name_es": "Mancuerna"}, "ez_bar": {"name_en": "EZ Curl Bar", "tags": ["free_weight"], "synonyms": ["ez bar", "ez curl bar", "curl bar", "w-bar", "cambered bar", "zig-zag bar"], "image": "ez-bar.webp", "name_de": "SZ-Stange", "name_es": "Barra Z"}, "flat_bench": {"name_en": "Flat Bench", "tags": ["free_weight", "upper_body"], "synonyms": ["bench", "flat weight bench", "utility bench", "adjustable bench (flat)"], "image": "flat-bench.webp", "name_de": "Flachbank", "name_es": "Banco plano"}, "hack_squat": {"name_en": "Hack Squat Machine", "tags": ["machine", "squat", "lower_body", "legs"], "synonyms": ["hack squat", "angled squat", "reverse leg press", "plate-loaded hack squat", "v-squat", "v squat", "v-squat machine"], "image": "hack-squat.webp", "name_de": "Hack-Squat-Maschine", "name_es": "Máquina hack squat"}, "incline_bench": {"name_en": "Incline Bench", "tags": ["free_weight", "upper_body"], "synonyms": ["incline weight bench", "adjustable incline bench", "adjustable bench (incline)"], "image": "incline-bench.webp", "name_de": "Schrägbank (positiv)", "name_es": "Banco inclinado"}, "kettlebell": {"name_en": "Kettlebell", "tags": ["free_weight"], "synonyms": ["kb", "cast iron kettlebell", "competition kettlebell", "girya"], "image": "kettlebell.webp", "name_de": "Kettlebell", "name_es": "Kettlebell"}, "lateral_raise_machine": {"name_en": "Lateral Raise Machine", "tags": ["machine", "push", "upper_body", "shoulders"], "synonyms": ["seated lateral raise", "side raise machine", "delt raise machine", "shoulder raise machine"], "image": "lateral-raise-machine.webp", "name_de": "Seitheben-Maschine", "name_es": "Máquina de elevaciones laterales"}, "plate_loaded_lateral_raise_machine": {"name_en": "Plate-Loaded Lateral Raise Machine", "tags": ["machine", "push", "upper_body", "shoulders"], "synonyms": ["iso-lateral raise machine", "plate loaded side raise", "plate loaded delt raise", "iso lateral lateral raise"], "image": "plate-loaded-lateral-raise-machine.webp", "name_de": "Seitheben-Maschine (scheibenbeladen)", "name_es": "Máquina de elevaciones laterales de discos"}, "pull_up_bar": {"name_en": "Pull-Up Bar", "tags": ["bodyweight_aid", "pull", "upper_body"], "synonyms": ["chin-up bar", "chin up bar", "power tower", "pull up bar", "doorway bar"], "image": "pull-up-bar.webp", "name_de": "Klimmzugstange", "name_es": "Barra de dominadas"}, "resistance_band": {"name_en": "Resistance Band", "tags": ["band", "full_body"], "synonyms": ["power band", "pull-up band", "assistance band", "tube band", "tubing band", "long resistance band"], "image": "resistance-band.webp", "name_de": "Fitnessband", "name_es": "Banda elástica"}, "rings": {"name_en": "Gymnastic Rings", "tags": ["rope_suspension", "bodyweight_aid", "upper_body"], "synonyms": ["gymnastic rings", "still rings", "wood rings", "olympic rings"], "image": "rings.webp", "name_de": "Ringe", "name_es": "Anillas"}, "smith_machine": {"name_en": "Smith Machine", "tags": ["machine"], "synonyms": ["smith bar", "guided barbell", "fixed barbell", "smith press"], "image": "smith-machine.webp", "name_de": "Multipresse", "name_es": "Máquina Smith"}, "stability_ball": {"name_en": "Stability Ball", "tags": ["ball", "conditioning_tool", "core"], "synonyms": ["swiss ball", "exercise ball", "yoga ball", "physio ball", "gym ball", "balance ball"], "image": "stability-ball.webp", "name_de": "Gymnastikball", "name_es": "Pelota de estabilidad"}}, "relation_targets": {"battle-rope-double-slam": {"name_en": "Battle Rope Double Slam", "name_de": "Battle-Rope Doppelschlag", "name_es": "Golpe Doble con Cuerdas de Batalla"}, "rear-delt-fly": {"name_en": "Rear Delt Fly", "name_de": "Hinterer Deltamuskel Fly", "name_es": "Apertura de Deltoides Posterior"}, "heel-elevated-squat": {"name_en": "Heel-Elevated Squat", "name_de": "Kniebeuge mit erhöhten Fersen", "name_es": "Sentadilla con Talones Elevados"}, "overhead-squat": {"name_en": "Overhead Squat", "name_de": "Überkopf-Kniebeuge", "name_es": "Sentadilla con Barra en Alto"}, "squat": {"name_en": "Barbell Back Squat", "name_de": "Langhantel-Kniebeuge", "name_es": "Sentadilla Trasera con Barra"}, "single-arm-db-row": {"name_en": "Single-Arm Dumbbell Row", "name_de": "Einarmiges Kurzhantel-Rudern", "name_es": "Remo con Mancuerna a Un Brazo"}, "lateral-raise": {"name_en": "Dumbbell Lateral Raise", "name_de": "Kurzhantel Seitheben", "name_es": "Elevación Lateral con Mancuernas"}, "single-arm-plate-loaded-lateral-raise": {"name_en": "Single-Arm Plate-Loaded Lateral Raise", "name_de": "Einarmiges Seitheben an der Scheibenmaschine", "name_es": "Elevación Lateral a Un Brazo en Máquina de Discos"}, "behind-the-neck-pull-ups": {"name_en": "Behind-the-Neck Pull-Up", "name_de": "Klimmzug in den Nacken", "name_es": "Dominada tras nuca"}, "close-grip-pull-ups": {"name_en": "Close-Grip Pull-Ups", "name_de": "Klimmzüge enger Griff", "name_es": "Dominadas con Agarre Cerrado"}, "muscle-ups": {"name_en": "Muscle Ups", "name_de": "Muscle-Up", "name_es": "Muscle-Ups"}, "weighted-pull-up": {"name_en": "Weighted Pull-Up", "name_de": "Klimmzug mit Zusatzgewicht", "name_es": "Dominada Lastrada"}, "lat-pulldown": {"name_en": "Lat Pulldown", "name_de": "Latzug", "name_es": "Jalón al Pecho"}, "scapular-pull-ups": {"name_en": "Scapular Pull Ups", "name_de": "Scapular Pull-Ups", "name_es": "Dominadas Escapulares"}, "smith-machine-squat": {"name_en": "Smith Machine Squat", "name_de": "Smith-Maschine Kniebeuge", "name_es": "Sentadilla en Máquina Smith"}, "ball-pike": {"name_en": "Ball Pike", "name_de": "Ball Pike", "name_es": "Pike con Pelota"}}}</script>
<script>
const DATA = JSON.parse(document.getElementById('repdb-data').textContent);
const EX = DATA.exercises || [];
const MU = DATA.muscles || {}, EQ = DATA.equipment || {};
const RT = DATA.relation_targets || {};
const ANIM_NOTE = DATA.animation_upgrade_note || null;
const LOCALES = DATA.locales || ['en','de','es'];
const byId = Object.fromEntries(EX.map(e => [e.id, e]));
let locale = LOCALES.includes('en') ? 'en' : LOCALES[0];
let cur = null;
const st = { bg:'bg-dark', style:'classic', mstills:false };

const T = (ex, f) => ex[f+'_'+locale] ?? ex[f+'_en'] ?? '';
const muName = s => (MU[s] && (MU[s]['name_'+locale] || MU[s].name_en)) || s;
const eqName = s => (EQ[s] && (EQ[s]['name_'+locale] || EQ[s].name_en)) || s;
const base = ex => ex.image_alias || ex.id;
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const styles = ex => ['classic','flat'].filter(s => ex.images && ex.images[s] && ex.images[s].length);

// ── left list ────────────────────────────────────────────────────────────────
const uniq = f => [...new Set(EX.map(f).filter(Boolean))].sort();
const uniqFlat = f => [...new Set(EX.flatMap(f).filter(Boolean))].sort();
// primary equipment + anything else the exercise requires (a flat bench,
// e.g., is not "the" equipment for Bench Dips but is just as mandatory) —
// equipment_alternatives is excluded here (an optional swap, not a requirement).
const requiredEquipment = e => [e.equipment, ...(e.additional_required_equipment||[])].filter(Boolean);
function fillSelect(el, vals, label){ el.innerHTML = '<option value="">'+label+'</option>' + vals.map(v=>`<option>${esc(v)}</option>`).join(''); }
const elList = document.getElementById('list'), elSearch = document.getElementById('search');
const elCat = document.getElementById('f-cat'), elBody = document.getElementById('f-body'), elEq = document.getElementById('f-eq'), elCount = document.getElementById('count');
fillSelect(elCat, uniq(e=>e.category), 'all categories');
fillSelect(elBody, uniq(e=>e.body_part), 'all body parts');
fillSelect(elEq, uniqFlat(requiredEquipment), 'all equipment');
// A tiny curated bundle (the 16-exercise preview) needs no search/filter
// tooling — the full list fits on screen. Paid bundles (480+) keep it.
if (EX.length <= 30) {
  elSearch.style.display = 'none';
  document.querySelector('.filters').style.display = 'none';
}

function filtered(){
  const q = elSearch.value.trim().toLowerCase();
  return EX.filter(e=>{
    if(elCat.value && e.category!==elCat.value) return false;
    if(elBody.value && e.body_part!==elBody.value) return false;
    if(elEq.value && !requiredEquipment(e).includes(elEq.value)) return false;
    if(q){ const hay=(e.id+' '+(e.name_en||'')+' '+(e.name_de||'')+' '+(e.name_es||'')).toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
}
function renderList(){
  const items = filtered();
  elCount.textContent = items.length + ' / ' + EX.length;
  elList.innerHTML = items.map(e=>{
    const b = base(e), s = styles(e)[0];
    const v = s ? e.images[s][e.images[s].length-1] : null;
    const thumb = (s && v) ? `images/${s}/${b}-${v}.webp` : '';
    return `<li data-id="${esc(e.id)}" class="${cur&&cur.id===e.id?'sel':''}">`
      + (thumb?`<img class="thumb" src="${thumb}" loading="lazy" alt="">`:`<span class="thumb"></span>`)
      + `<span><span class="nm">${esc(T(e,'name'))}</span><br><span class="sub">${esc(e.id)}</span></span></li>`;
  }).join('');
}
elList.addEventListener('click', e=>{ const li=e.target.closest('li[data-id]'); if(li){ select(li.dataset.id); openDetail(); } });
[elSearch,elCat,elBody,elEq].forEach(el=>el.addEventListener('input', renderList));

// ── mobile master→detail ─────────────────────────────────────────────────────
// ≤900px the rail is the home screen; tapping an exercise opens a full-screen
// detail view. Each open gets a history entry so the system Back button
// returns to the list instead of leaving the page (pushState can throw under
// exotic file:// setups — the bar's own button then falls back to closeDetail).
const app = document.getElementById('app');
const mqMobile = matchMedia('(max-width:900px)');
let railScroll = 0;  // display:none drops the list's scroll position — save it
function openDetail(){
  if(!mqMobile.matches) return;
  railScroll = elList.scrollTop;
  app.classList.add('m-detail');
  document.getElementById('detail').scrollTop = 0;
  if(!(history.state && history.state.repdb)) try{ history.pushState({repdb:1},''); }catch(e){}
}
function closeDetail(){ app.classList.remove('m-detail'); elList.scrollTop = railScroll; }
document.getElementById('mob-back').onclick = () => { if(history.state && history.state.repdb) history.back(); else closeDetail(); };
window.addEventListener('popstate', () => { if(app.classList.contains('m-detail')) closeDetail(); });

// ── detail ───────────────────────────────────────────────────────────────────
function select(id){ cur = byId[id]; if(!cur) return; renderList(); renderDetail(); document.getElementById('detail').scrollTop = 0; }
// Step to the prev/next exercise in the current (filtered) list — the on-image
// arrows, so a phone can flip through without returning to the list. Clamped at
// the ends (the arrows disable there); stays in the detail view.
function selectRel(delta){
  const items = filtered();
  const i = items.findIndex(e => cur && e.id === cur.id);
  if(i < 0) return;
  const j = i + delta;
  if(j < 0 || j >= items.length) return;
  select(items[j].id);
}

// One tile per still variant (start/peak or main) plus the animation loop —
// everything visible at once, no frame switching. Stills follow the selected
// style (classic/flat toggle — never both at once); the animation is a classic
// asset, so its tile is hidden (not removed — the loop survives) on flat.
function stageBlocks(){
  const b = base(cur), ss = styles(cur);
  const s = ss.includes(st.style) ? st.style : (ss.includes('classic') ? 'classic' : ss[0]);
  const out = ((s && cur.images[s]) || []).map(v => ({label:v, v, src:`images/${s}/${b}-${v}.webp`}));
  if(cur.animation) out.push({label:'animation', src:`images/animations/${b}.webp`, anim:true, twoPose: cur.animation_type==='two_pose'});
  return {blocks:out, style:s};
}
function renderDetail(){
  const d = document.getElementById('detail');
  document.getElementById('mob-name').textContent = cur ? T(cur,'name') : '';
  if(!cur){ d.innerHTML = '<div class="empty">Select an exercise</div>'; return; }
  const ss = styles(cur);
  const {blocks, style:sEff} = stageBlocks();
  const hasAnim = !!cur.animation && sEff==='classic';
  const showTwoPoseNote = hasAnim && cur.animation_type==='two_pose' && ANIM_NOTE;
  const twoPoseNote = showTwoPoseNote
    ? `<div class="anim-note">This exercise still uses a simplified two-pose loop. <b>${ANIM_NOTE.two_pose} of ${ANIM_NOTE.total}</b> exercises (${ANIM_NOTE.pct}%) are like this — we're upgrading the rest to full motion clips over time.</div>`
    : '';
  d.innerHTML = (blocks.length ? `<div class="stages${hasAnim?' has-anim':''}${hasAnim&&st.mstills?' show-stills':''}">${blocks.map(x =>
      `<figure${x.anim?` data-anim="1"${sEff!=='classic'?' style="display:none"':''}`:''}><div class="stage ${st.bg}"><img src="${x.src}"${x.v?` data-v="${esc(x.v)}"`:''} alt="${esc(T(cur,'name'))} — ${esc(x.label)}" onload="this.classList.add('ready')" onerror="this.classList.add('ready')"><div class="spin"></div></div><figcaption>${esc(x.label)}</figcaption></figure>`).join('')}<button class="nav-ex" data-nav="-1" type="button" aria-label="Previous exercise">&lsaquo;</button><button class="nav-ex" data-nav="1" type="button" aria-label="Next exercise">&rsaquo;</button></div>${twoPoseNote}
    <div class="controls">
      <div class="ctl"><span class="lbl">style</span><div class="grp" id="c-style">${['classic','flat'].map(s=>`<button data-s="${s}" class="${sEff===s?'on':''}" ${ss.includes(s)?'':'disabled'}>${s}</button>`).join('')}</div></div>
      ${hasAnim?`<div class="ctl mview-ctl"><span class="lbl">show</span><div class="grp" id="c-mview"><button data-mv="loop" class="${!st.mstills?'on':''}">loop</button><button data-mv="stills" class="${st.mstills?'on':''}">start + peak</button></div></div>`:''}
      <div class="ctl" id="bg-ctl"${sEff==='classic'?'':' style="display:none"'}><span class="lbl">background</span><div class="grp" id="c-bg">${[['bg-checker','checker'],['bg-white','white'],['bg-dark','dark'],['bg-brand','brand']].map(([k,l])=>`<button data-bg="${k}" class="${st.bg===k?'on':''}">${l}</button>`).join('')}</div></div>
    </div>` : '')
    + `<div class="card">
      <h2>${esc(T(cur,'name'))}</h2>
      <div class="slug">${esc(cur.id)}${cur.image_alias?` · images via <b>${esc(cur.image_alias)}</b>`:''}</div>
      <div class="locsw" id="locsw">${LOCALES.map(l=>`<button data-loc="${l}" class="${locale===l?'on':''}">${l.toUpperCase()}</button>`).join('')}</div>
      ${T(cur,'description')?`<div class="sec"><h3>description</h3><div>${esc(T(cur,'description'))}</div></div>`:''}
      ${chipSec('synonyms', cur.synonyms)}
      <div class="sec"><h3>details</h3><dl class="meta">${metaRows()}</dl></div>
      ${chipSec('goals', cur.goals)}
      ${chipSec('tags', cur.tags)}
      ${muscleSec()}
      ${listSec('instructions', T(cur,'instructions'))}
      ${listSec('tips', T(cur,'tips'))}
      ${relSec()}
      <div class="sec"><h3>assets</h3><dl class="meta">
        <dt>image styles</dt><dd>${ss.map(s=>`${s} [${cur.images[s].join(', ')}]`).join(' · ')||'—'}</dd>
        <dt>animation</dt><dd>${cur.animation?'<span class="flag">yes</span>':'no'}</dd>
      </dl></div>
      <details><summary>raw JSON</summary><pre>${esc(JSON.stringify(cur,null,2))}</pre></details>
    </div>`;
  wire();
}
function metaRows(){
  const addl = (cur.additional_required_equipment||[]).map(eqName).join(', ');
  const alts = (cur.equipment_alternatives||[]).map(eqName).join(', ');
  const rows = [['category',cur.category],['force',cur.force_type],['mechanic',cur.mechanic],['difficulty',cur.difficulty],
    ['equipment',cur.equipment?eqName(cur.equipment):null],
    ['also requires',addl||null],
    ['equipment alternatives',alts||null],
    ['body part',cur.body_part],
    ['unilateral',cur.is_unilateral?'yes':null],['bodyweight',cur.is_bodyweight?'yes':null],
    ['variation group',cur.variation_group],['MET',cur.met]];
  return rows.filter(r=>r[1]!=null&&r[1]!=='').map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('');
}
function chipSec(t,a){ if(!a||!a.length) return ''; return `<div class="sec"><h3>${t}</h3><div class="chips">${a.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>`; }
function muscleSec(){ const p=cur.primary_muscles||[],s=cur.secondary_muscles||[]; if(!p.length&&!s.length) return '';
  return `<div class="sec"><h3>muscles</h3><div class="chips">${p.map(m=>`<span class="chip">${esc(muName(m))}</span>`).join('')}${s.map(m=>`<span class="chip sec2">${esc(muName(m))}</span>`).join('')}</div></div>`; }
function listSec(t,v){ if(!v) return ''; const arr=Array.isArray(v)?v:[v]; const tag=t==='instructions'?'ol':'ul';
  return `<div class="sec"><h3>${t}</h3><${tag}>${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</${tag}></div>`; }
function relSec(){ const r=cur.relations||[]; if(!r.length) return '';
  return `<div class="sec"><h3>relations</h3>${r.map(x=>{const tg=x.to||x.id;const ex=byId[tg];
    if(ex) return `<div class="rel"><span class="ty">${esc(x.type)}</span><a data-go="${esc(tg)}">${esc(T(ex,'name'))}</a></div>`;
    const rt=RT[tg]; const nm = rt ? (rt['name_'+locale]||rt.name_en||tg) : tg;
    return `<div class="rel"><span class="ty">${esc(x.type)}</span><span class="out" title="${esc(tg)} — not included in this bundle">${esc(nm)}</span></div>`;
  }).join('')}</div>`; }

function wire(){
  const d = document.getElementById('detail');
  const cbg = d.querySelector('#c-bg');
  // Swap classes/srcs in place — re-rendering would restart the animation loop.
  if(cbg) cbg.onclick = e=>{const b=e.target.closest('button[data-bg]');if(!b)return;st.bg=b.dataset.bg;
    d.querySelectorAll('.stage').forEach(s=>s.className='stage '+st.bg);
    cbg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.bg===st.bg));};
  const cs = d.querySelector('#c-style');
  if(cs) cs.onclick = e=>{const b=e.target.closest('button[data-s]');if(!b||b.disabled)return;st.style=b.dataset.s;
    const vsNew = (cur.images && cur.images[st.style]) || [];
    const imgs = [...d.querySelectorAll('.stage img[data-v]')];
    // On phones the style switch also adds/removes the loop/frames toggle, so
    // rebuild there; desktop keeps the in-place swap (never restarts the loop).
    if(!mqMobile.matches && imgs.length===vsNew.length && imgs.every(im=>vsNew.includes(im.dataset.v))){
      const bb = base(cur);
      imgs.forEach(im=>{im.classList.remove('ready');im.src=`images/${st.style}/${bb}-${im.dataset.v}.webp`;});
      d.querySelectorAll('.stages figure[data-anim]').forEach(f=>f.style.display = st.style==='classic' ? '' : 'none');
      const sg = d.querySelector('.stages');
      if(sg) sg.classList.toggle('has-anim', st.style==='classic' && !!cur.animation);
      // Flat is opaque — the background picker changes nothing there.
      const bgc = d.querySelector('#bg-ctl');
      if(bgc) bgc.style.display = st.style==='classic' ? '' : 'none';
      cs.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.s===st.style));
    } else renderDetail();  // variant sets differ, or phone — rebuild
  };
  // loop ⇄ start+peak (phone, classic+animation) — swap in place so flipping
  // back to the loop doesn't restart it.
  const cm = d.querySelector('#c-mview');
  if(cm) cm.onclick = e=>{const b=e.target.closest('button[data-mv]');if(!b)return;
    st.mstills = b.dataset.mv==='stills';
    const sg = d.querySelector('.stages'); if(sg) sg.classList.toggle('show-stills', st.mstills);
    cm.querySelectorAll('button').forEach(x=>x.classList.toggle('on',(x.dataset.mv==='stills')===st.mstills));};
  // on-image prev/next
  const items = filtered();
  const idx = items.findIndex(e=>cur&&e.id===cur.id);
  d.querySelectorAll('.nav-ex').forEach(b=>{
    const delta = +b.dataset.nav;
    b.disabled = idx<0 || idx+delta<0 || idx+delta>=items.length;
    b.onclick = ()=>selectRel(delta);
  });
  d.querySelector('#locsw').onclick = e=>{const b=e.target.closest('button[data-loc]');if(!b)return;locale=b.dataset.loc;renderList();renderDetail();};
  d.querySelectorAll('a[data-go]').forEach(a=>a.onclick=()=>select(a.dataset.go));
}

renderList();
if(EX.length) select(EX[0].id);

const ptMedia = document.querySelector('#premium-teaser .pt-media');
if(ptMedia) ptMedia.addEventListener('click', () => ptMedia.classList.toggle('playing'));
</script>
